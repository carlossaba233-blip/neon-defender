    else { codeNote('Código no válido'); tone(150, 0.12, 'square', 0.05, 0); return; }
    if (c !== 'BORRAR') logCodes(before);
    saveMeta(); powerSound();
  }
  function drawCode() {
    var by = H * 0.36 + 62, i, R;
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
    glow('#00f5ff', 18); text('CÓDIGOS', W / 2, H * 0.2, Math.min(40, W / 9), '#ffffff'); noGlow();
    text('Escribe un código y pulsa CANJEAR', W / 2, H * 0.2 + 30, 14, '#b0b0d0');
    codeIn.style.left = (ox + W / 2 - 130) + 'px'; codeIn.style.top = (H * 0.36) + 'px';
    codeRects = [{ x: W / 2 - 130, y: by, w: 260, h: 42, ok: true }, { x: W / 2 - 80, y: by + 54, w: 160, h: 36, back: true }];
    for (i = 0; i < 2; i++) {
      R = codeRects[i]; ctx.fillStyle = i ? 'rgba(255,255,255,0.06)' : 'rgba(0,245,255,0.16)'; ctx.fillRect(R.x, R.y, R.w, R.h);
      ctx.strokeStyle = i ? 'rgba(255,255,255,0.4)' : '#00f5ff'; ctx.lineWidth = 2; ctx.strokeRect(R.x, R.y, R.w, R.h);
      text(i ? 'VOLVER (ESC)' : 'CANJEAR (ENTER)', W / 2, R.y + R.h / 2 + 6, i ? 15 : 17, '#ffffff');
    }
    if (codeMsgT > clock) text(codeMsg, W / 2, by + 118, 16, codeMsg.indexOf('no válido') >= 0 ? '#ff6b8a' : '#7dffa0');
    text('Invencible: ' + (cheat.god ? 'SÍ' : 'NO') + '   ·   Arma nivel 6: ' + (cheat.wpn ? 'SÍ' : 'NO'), W / 2, by + 150, 13, '#8a8aa8');
    text('◉ ' + wallet + '   ◆ ' + gems + '   · Nivel máx. ' + prog, W / 2, by + 172, 13, '#8a8aa8');
    text('Lo obtenido con códigos se quita al abrir el juego de nuevo', W / 2, by + 194, 12, '#6a6a88');
  }
  function shopNote(m) { shopMsg = m; shopMsgT = clock + 1.6; }
  function openShop() { shopPrev = state; state = 'shop'; shopSel = 0; clearKeys(); }
  function closeShop() { state = shopPrev; clearKeys(); }
  function buy(i, slot) {
    if (tab === 1) {
      i = shipOrder[i];
      var S = SHIPS[i];
      if (own.indexOf(i) < 0) {
        if (S.gem) {
          if (gems < S.gem) { shopNote('Te faltan ' + (S.gem - gems) + ' diamantes'); tone(150, 0.12, 'square', 0.05, 0); return; }
          gems -= S.gem;
        } else {
          if (wallet < S.cost) { shopNote('Te faltan ' + (S.cost - wallet) + ' monedas'); tone(150, 0.12, 'square', 0.05, 0); return; }
          wallet -= S.cost;
        }
        own.push(i); powerSound();
      }
      sel[slot || 0] = i; saveMeta(); shopNote('¡' + S.n + ' equipada!');
      return;
    }
    var U = UPG[i], lv = up[U.k];
    if (lv >= U.max) { shopNote('Ya está al máximo'); return; }
    var cost = U.base * (lv + 1);
    if (wallet < cost) { shopNote('Te faltan ' + (cost - wallet) + ' monedas'); tone(150, 0.12, 'square', 0.05, 0); return; }
    wallet -= cost; up[U.k]++; saveMeta(); powerSound(); shopNote('¡Comprado!');
  }

  function setMode(n) {
    if (numPlayers === n) return;
    numPlayers = n; clearKeys(); loadBest(); resize(); reset();
    try { localStorage.setItem('nd_players', String(n)); } catch (e) {}
    tone(520, 0.05, 'triangle', 0.05, 0);
  }

  // J1: W A S D + ESPACIO.  J2: flechas + ENTER (en modo 1 jugador las flechas mueven a J1)
  function keyTarget(k) {
    var two = numPlayers === 2 ? 1 : 0;
    switch (k) {
      case 'a': case 'A': return [0, 'left'];
      case 'd': case 'D': return [0, 'right'];
      case 'w': case 'W': return [0, 'up'];
      case 's': case 'S': return [0, 'down'];
      case ' ': return [0, 'fire'];
      case 'ArrowLeft': return [two, 'left'];
      case 'ArrowRight': return [two, 'right'];
      case 'ArrowUp': return [two, 'up'];
      case 'ArrowDown': return [two, 'down'];
      case 'Enter': return two ? [1, 'fire'] : null;
    }
    return null;
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    touchMode = false; tch = null;
    if (state === 'code') { if (k === 'Enter') redeem(); else if (k === 'Escape') closeCode(); return; }
    if (state === 'shop') {
      var nn = tab === 0 ? UPG.length : SHIPS.length;
      if (k === 'ArrowUp' || k === 'w' || k === 'W') shopSel = (shopSel + nn - 1) % nn;
      else if (k === 'ArrowDown' || k === 's' || k === 'S') shopSel = (shopSel + 1) % nn;
      else if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'A' || k === 'd' || k === 'D') { tab = 1 - tab; shopSel = 0; }
      else if ((k === 'Enter' || k === ' ') && !e.repeat) buy(shopSel, 0);
      else if ((k === '1' || k === '2') && tab === 1) buy(shopSel, +k - 1);
      else if (k === 'Escape' || k === 't' || k === 'T') closeShop();
      e.preventDefault(); return;
    }
    if (state === 'help') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') helpTab = (helpTab + helpTabs.length - 1) % helpTabs.length;
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') helpTab = (helpTab + 1) % helpTabs.length;
      else if (k === 'Escape' || k === 'Enter' || k === ' ' || k === 'h' || k === 'H' || k === '?') closeHelp();
      e.preventDefault(); return;
    }
    if (state === 'map') {
      if (k === 'ArrowLeft' || k === 'ArrowDown' || k === 'a' || k === 'A' || k === 's' || k === 'S') mapSel = Math.max(1, mapSel - 1);
      else if (k === 'ArrowRight' || k === 'ArrowUp' || k === 'd' || k === 'D' || k === 'w' || k === 'W') mapSel = Math.min(prog, mapSel + 1);
      else if ((k === 'Enter' || k === ' ') && !e.repeat) start(mapSel);
      else if (k === 'Escape') state = 'menu';
      else if (k === 't' || k === 'T') openShop();
      e.preventDefault(); return;
    }
    if (state === 'paused' && (k === 'q' || k === 'Q')) { exitToMenu(); return; }
    if (state === 'over' && (k === 'q' || k === 'Q' || k === 'Escape')) { exitToMenu(); return; }
    if ((state === 'menu' || (state === 'over' && performance.now() - overAt > 900)) && (k === 't' || k === 'T')) { openShop(); return; }
    if (state === 'menu') {
      if (k === '1') { setMode(1); return; }
      if (k === '2') { setMode(2); return; }
      if (k === 'h' || k === 'H' || k === '?') { openHelp(); return; }
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { setMode(1); e.preventDefault(); return; }
      if (k === 'ArrowRight' || k === 'd' || k === 'D') { setMode(2); e.preventDefault(); return; }
    }
    var t = keyTarget(k);
    if (t) {
      keyState[t[0]][t[1]] = true;
      if (t[0] === 0 && t[1] !== 'fire' && numPlayers === 1) mouseT = null;
      e.preventDefault();
    }
    if (k === ' ') { if (!e.repeat && state !== 'playing') action(); }
    else if (k === 'Enter') { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { if (!e.repeat) togglePause(); }
    else if (k === 'm' || k === 'M') { toggleMute(); }
    else if (k === 'f' || k === 'F') {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (err) {}
    }
  });
  window.addEventListener('keyup', function (e) {
    var t = keyTarget(e.key);
    if (t) keyState[t[0]][t[1]] = false;
  });
  window.addEventListener('pagehide', saveMeta);
  window.addEventListener('beforeunload', saveMeta);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveMeta(); });
  window.addEventListener('blur', function () {
    saveMeta();
    clearKeys();
    if (state === 'playing') state = 'paused';
  });

  // Clic o toque sobre la interfaz. Devuelve false si el toque es "de juego" (estado playing)
  function pointer(cx, cy) {
    var x = cx - ox, y = cy, i, o;
    if (x >= 0 && x < 60 && y < 60) { toggleMute(); return true; }
    if (state === 'code') {
      for (i = 0; i < codeRects.length; i++) { o = codeRects[i]; if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) { if (o.back) closeCode(); else redeem(); } }
      return true;
    }
    if (state === 'help') {
      for (i = 0; i < helpRects.length; i++) {
        o = helpRects[i];
        if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) { if (o.back) closeHelp(); else helpTab = o.tab; return true; }
      }
      return true;
    }
    if (state === 'map') {
      if (x > W - 130 && y < 56) { state = 'menu'; return true; }
      if (x > W / 2 - 100 && x < W / 2 + 100 && y > H - 74 && y < H - 42) { openShop(); return true; }
      for (i = 0; i < mapRects.length; i++) {
        o = mapRects[i];
        if ((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y) < o.r * o.r) { if (o.lv <= prog) { mapSel = o.lv; start(o.lv); } return true; }
      }
      return true;
    }
    if (state === 'paused') {
      for (i = 0; i < pauseBtns.length; i++) {
        o = pauseBtns[i];
        if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) { if (o.exit) exitToMenu(); else state = 'playing'; return true; }
      }
      return true;
    }
    if (state === 'playing') {
      if (x >= 56 && x < 120 && y < 64) { togglePause(); return true; }
      return false;
    }
    if (state === 'shop') {
      for (i = 0; i < shopRects.length; i++) {
        o = shopRects[i];
        if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) { if (o.back) closeShop(); else if (o.tab !== undefined) { tab = o.tab; shopSel = 0; } else { shopSel = o.i; buy(o.i, 0); } return true; }
      }
      return true;
    }
    if (state === 'menu') {
      for (i = 0; i < menuBtns.length; i++) {
        o = menuBtns[i];
        if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) {
          if (o.shop) openShop(); else if (o.code) openCode(); else if (o.help) openHelp(); else if (o.play) action(); else setMode(o.n);
          return true;
        }
      }
      return true;
    }
    if (state === 'over') {
      if (performance.now() - overAt > 900) {
        for (i = 0; i < overBtns.length; i++) {
          o = overBtns[i];
          if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) { if (o.menu) exitToMenu(); else openShop(); return true; }
        }
      }
    }
    action();
    return true;
  }

  canvas.addEventListener('wheel', function (e) {
    if (state === 'shop') { shopTop = Math.max(0, Math.min(shopMax, shopTop + (e.deltaY > 0 ? 1 : -1))); e.preventDefault(); }
  }, { passive: false });

  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (performance.now() - lastTouch < 800) return; // evento emulado tras un toque
    touchMode = false;
    if (!pointer(e.clientX, e.clientY) && numPlayers === 1) mouseFire = true;
  });

  // Táctil: arrastrar mueve la nave (movimiento relativo) y dispara sola en 1 jugador
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    lastTouch = performance.now(); touchMode = true;
    var t = e.changedTouches[0], P = players[0];
    if (state === 'shop' && t.clientY > H * 0.08 + 70 && t.clientY < H - 70) {
      shopTouch = { id: t.identifier, x: t.clientX, y: t.clientY, top: shopTop, moved: false };
      return;
    }
    if (pointer(t.clientX, t.clientY)) return;
    if (state === 'playing' && numPlayers === 1 && P && P.alive && !tch) tch = { id: t.identifier, fx: t.clientX, fy: t.clientY, px: P.x, py: P.y };
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    lastTouch = performance.now();
    var P = players[0];
    if (shopTouch) {
      for (var si = 0; si < e.changedTouches.length; si++) {
        var sc = e.changedTouches[si];
        if (sc.identifier === shopTouch.id) {
          var dy = sc.clientY - shopTouch.y;
          if (Math.abs(dy) > 10) shopTouch.moved = true;
          if (shopTouch.moved) shopTop = Math.max(0, Math.min(shopMax, shopTouch.top - Math.round(dy / shopRH)));
        }
      }
      return;
    }
    if (!tch || state !== 'playing' || !P || !P.alive) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var c = e.changedTouches[i];
      if (c.identifier === tch.id) {
        mouseT = {
          x: Math.max(P.r, Math.min(W - P.r, tch.px + (c.clientX - tch.fx) * 1.15)),
          y: Math.max(H * 0.6, Math.min(H - 40, tch.py + (c.clientY - tch.fy) * 1.15))
        };
      }
    }
  }, { passive: false });
  function touchEnd(e) {
    e.preventDefault(); lastTouch = performance.now();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var c = e.changedTouches[i];
      if (tch && c.identifier === tch.id) tch = null;
      if (shopTouch && c.identifier === shopTouch.id) {
        if (!shopTouch.moved && e.type === 'touchend') pointer(shopTouch.x, shopTouch.y);
        shopTouch = null;
      }
    }
  }
  canvas.addEventListener('touchend', touchEnd, { passive: false });
  canvas.addEventListener('touchcancel', touchEnd, { passive: false });
  window.addEventListener('mouseup', function () { mouseFire = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('mousemove', function (e) {
    var K = keyState[0], P = players[0];
    if (state === 'playing' && numPlayers === 1 && performance.now() - lastTouch > 800 && P && P.alive && !K.left && !K.right && !K.up && !K.down) {
      mouseT = {
        x: Math.max(P.r, Math.min(W - P.r, e.clientX - ox)),
        y: Math.max(H * 0.6, Math.min(H - 40, e.clientY))
      };
    }
  });

  // ---------- Mando / gamepad ----------
  var padBlocked = false;
  function padBtn(bt, k) { return !!(bt[k] && (bt[k].pressed || bt[k].value > 0.5)); }
  function dz(v) { var a = Math.abs(v); return a < 0.22 ? 0 : (v < 0 ? -1 : 1) * Math.min(1, (a - 0.22) / 0.78); }
  function padUI(ev) {
    var nn;
    if (!(ev.a || ev.b || ev.x || ev.y || ev.start || ev.l || ev.r || ev.u || ev.d)) return;
    if (state === 'menu') {
      if (ev.l) setMode(1); else if (ev.r) setMode(2);
      else if (ev.a || ev.start) action();
      else if (ev.y) openHelp(); else if (ev.x) openShop();
    } else if (state === 'playing') {
      if (ev.start) togglePause();
    } else if (state === 'paused') {
      if (ev.a || ev.start) state = 'playing'; else if (ev.b) exitToMenu();
    } else if (state === 'map') {
      if (ev.l || ev.d) mapSel = Math.max(1, mapSel - 1);
      else if (ev.r || ev.u) mapSel = Math.min(prog, mapSel + 1);
      else if (ev.a || ev.start) start(mapSel);
      else if (ev.b) state = 'menu';
      else if (ev.x || ev.y) openShop();
    } else if (state === 'shop') {
      nn = tab === 0 ? UPG.length : SHIPS.length;
      if (ev.u) shopSel = (shopSel + nn - 1) % nn;
      else if (ev.d) shopSel = (shopSel + 1) % nn;
      else if (ev.l || ev.r) { tab = 1 - tab; shopSel = 0; }
      else if (ev.a) buy(shopSel, 0);
      else if (ev.x && tab === 1) buy(shopSel, 1);
      else if (ev.b || ev.start) closeShop();
    } else if (state === 'help') {
      if (ev.l) helpTab = (helpTab + helpTabs.length - 1) % helpTabs.length; else if (ev.r) helpTab = (helpTab + 1) % helpTabs.length;
      else if (ev.a || ev.b || ev.start) closeHelp();
    } else if (state === 'over') {
      if (performance.now() - overAt > 900) {
        if (ev.a || ev.start) action(); else if (ev.b) exitToMenu(); else if (ev.x || ev.y) openShop();
      }
    }
  }
  function pollPads() {
    var gps = [], list = [], i, n, g, bt, ax, lx, ly, fire, cur, prev, ev, kk, slot;
    if (padBlocked) return;
    try { gps = (navigator.getGamepads ? navigator.getGamepads() : null) || []; }
    catch (err) { padBlocked = true; padOn = false; return; } // el navegador/iframe bloquea el acceso a mandos
    padState[0].x = padState[0].y = padState[1].x = padState[1].y = 0;
    padState[0].fire = padState[1].fire = false;
    for (i = 0; i < gps.length; i++) if (gps[i] && gps[i].connected) list.push(gps[i]);
    padOn = list.length > 0;
    for (n = 0; n < list.length; n++) {
      g = list[n]; bt = g.buttons || []; ax = g.axes || [];
      lx = dz(ax[0] || 0); ly = dz(ax[1] || 0);
      if (padBtn(bt, 14)) lx = -1; else if (padBtn(bt, 15)) lx = 1;
      if (padBtn(bt, 12)) ly = -1; else if (padBtn(bt, 13)) ly = 1;
      fire = padBtn(bt, 0) || padBtn(bt, 2) || padBtn(bt, 4) || padBtn(bt, 5) || padBtn(bt, 6) || padBtn(bt, 7);
      cur = { a: padBtn(bt, 0), b: padBtn(bt, 1), x: padBtn(bt, 2), y: padBtn(bt, 3), start: padBtn(bt, 9), l: lx < -0.6, r: lx > 0.6, u: ly < -0.6, d: ly > 0.6 };
      prev = padPrev[g.index] || {};
      padPrev[g.index] = cur;
      if (n === 0) {
        ev = {};
        for (kk in cur) ev[kk] = cur[kk] && !prev[kk];
        padUI(ev);
      }
      if (numPlayers === 1 && n > 0) continue;
      slot = numPlayers === 2 ? Math.min(n, 1) : 0;
      padState[slot].x = lx; padState[slot].y = ly; padState[slot].fire = padState[slot].fire || fire;
    }
  }
  window.addEventListener('gamepadconnected', function () { padMsg = '🎮 Control conectado'; padMsgT = clock + 3; });
  window.addEventListener('gamepaddisconnected', function () {
    padMsg = '🎮 Control desconectado'; padMsgT = clock + 3;
    if (state === 'playing') state = 'paused';
  });

  // Gancho para pruebas automáticas (no hace nada en el juego real)
  if (typeof __ND_TEST !== 'undefined') {
    __ND_TEST.get = function () {
      var p0 = players[0] || {};
      return { state: state, level: level, lives: p0.lives, score: totalScore(), weapon: p0.weapon, player: p0, players: players, enemies: enemies, eBullets: eBullets.length, W: W, H: H, clearing: clearing };
    };
  }

  // ---------- Bucle ----------
  resize();
  reset();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock += dt;
    pollPads();
    if (state === 'playing') update(dt);

    var wdt = (state === 'over' && now - overAt < 900) ? dt * 0.3 : dt;
    if (state !== 'paused') {
      if (state === 'over') driftWorld(wdt);
      updateParticles(wdt);
      updateBackdrop(wdt);
    }
    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt * 2.5;

    if (Math.floor(clock / 5) !== Math.floor((clock - dt) / 5)) saveMeta();

    if (state === 'playing' && !muted) { engineStart(); engineUpdate(); } else engineStop();

    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
// Service worker opcional (modo sin conexión al servirlo por https): solo se registra si junto al juego hay un sw.js.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    fetch('sw.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      if (r.ok) navigator.serviceWorker.register('sw.js').catch(function () {});
    }).catch(function () {});
  });
}
</script>
